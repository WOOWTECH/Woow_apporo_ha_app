name: On Push

on: # yamllint disable-line rule:truthy
  workflow_dispatch:
    inputs:
      beta:
        description: "true if this is a beta release"
        required: false
        default: "false"
  push:
    branches:
      - main

env:
  SUPPLY_UPLOAD_MAX_RETRIES: 5

jobs:
  app_build:
    name: Github and Firebase Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: ruby/setup-ruby@90be1154f987f4dc0fe0dd0feedac9e473aa4ba8 # v1.286.0
        with:
          ruby-version: "4.0.1"
          bundler-cache: true

      - uses: ./.github/actions/create-release-number
        name: Create Release Number
        id: rel_number

      - uses: ./.github/actions/inflate-secrets
        name: Inflate Secrets
        with:
          keystore: ${{ secrets.ORIGINAL_KEYSTORE_FILE }}
          google-services: ${{ secrets.GOOGLESERVICES }}
          firebase-creds: ${{ secrets.FIREBASECREDS }}
          playstore-creds: ${{ secrets.PLAYSTORECREDS }}

      - uses: ./.github/actions/create-release-notes
        name: Create Release Notes
        with:
          tag-name: ${{ steps.rel_number.outputs.version }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # Download Translations 已移除（首版）。三個理由,任一個都足夠:
      #
      # 1. 它會讓這個 job 直接掛掉。密鑰未設定時 `jq -r '.bundle_url'` 會印出 "null",
      #    接著 `curl null` 以退出碼 6 失敗;composite action 跑在 `bash -eo pipefail`
      #    之下,所以整個 job 在 gradle 還沒開始前就結束。
      # 2. 它會覆蓋語系清單。那支腳本把產生的 locales_config.xml 寫到
      #    app/src/main/res/xml/ 與 wear/src/main/res/xml/,但本 repo 的檔案在
      #    common/src/main/res/xml/。app 模組的資源優先序高於 common,所以產生出來的
      #    那份會蓋掉我們刻意維持的「en + zh-TW」兩語系設定。
      # 3. 上游的翻譯裡 app_name 是 "Home Assistant"。多拉進來的語系會讓 App 在那些
      #    語言下顯示上游品牌名 —— 那是商標問題,不是體驗瑕疵。
      #
      # 要恢復多語系時,要先有自己的 Lokalise 專案(不是上游的),並且先修好上面第 2 點
      # 的路徑問題,否則語系清單仍會被蓋掉。決策紀錄見 RELEASE-CHECKLIST 6-2。

      - name: Build Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ORIGINAL_KEYSTORE_FILE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ORIGINAL_KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ORIGINAL_KEYSTORE_ALIAS_PASSWORD }}
          VERSION_CODE: ${{ steps.rel_number.outputs.version-code }}
        # Wear OS and Android Automotive are excluded from the first release, so they are not part
        # of the Gradle build (see settings.gradle.kts). Adding their tasks back here would fail.
        run: |
          ./gradlew :common:assemble :app:assembleRelease

      - name: Archive Build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-apks
          path: ./**/*.apk

      - name: Create Version File
        if: github.event.inputs.beta == 'true'
        shell: bash
        env:
          VERSION_CODE: ${{ steps.rel_number.outputs.version-code }}
        run: |
          echo $VERSION_CODE > ./app/build/outputs/version_code.txt

      - name: Create Github Pre-Release
        if: github.event.inputs.beta == 'true'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: ${{ steps.rel_number.outputs.version }}
          body_path: ./app/build/outputs/changelogGithub
          draft: false
          prerelease: true
          files: |
            ./app/build/outputs/apk/full/release/app-full-release.apk
            ./app/build/outputs/apk/minimal/release/app-minimal-release.apk
            ./app/build/outputs/version_code.txt
            ./strings.zip
            ./app/src/main/res/xml/locales_config.xml

      - name: Deploy to Firebase
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ORIGINAL_KEYSTORE_FILE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.ORIGINAL_KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.ORIGINAL_KEYSTORE_ALIAS_PASSWORD }}
          VERSION_CODE: ${{ steps.rel_number.outputs.version-code }}
        run: ./gradlew appDistributionUploadFullRelease

      - name: Prepare Amazon Listing
        if: github.event.inputs.beta == 'true'
        run: bundle exec fastlane prep_amazon
        env:
          AMAZON_APPSTORE_CLIENT_ID: ${{ secrets.AMAZON_APPSTORE_CLIENT_ID }}
          AMAZON_APPSTORE_CLIENT_SECRET: ${{ secrets.AMAZON_APPSTORE_CLIENT_SECRET }}
          AMAZON_APPSTORE_APP_ID: ${{ secrets.AMAZON_APPSTORE_APP_ID }}

      - name: Upload Github Dependencies
        uses: gradle/actions/dependency-submission@4d9f0ba0025fe599b4ebab900eb7f3a1d93ef4c2 # v5.0.0

      - name: Print `git status`
        run: git status

  play_publish:
    name: Play Publish
    runs-on: ubuntu-latest
    concurrency:
      group: playstore_deploy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-build-env
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - uses: ruby/setup-ruby@90be1154f987f4dc0fe0dd0feedac9e473aa4ba8 # v1.286.0
        with:
          ruby-version: "4.0.1"
          bundler-cache: true

      - uses: ./.github/actions/create-release-number
        name: Create Release Number
        id: rel_number

      - uses: ./.github/actions/inflate-secrets
        name: Inflate Secrets
        with:
          keystore: ${{ secrets.UPLOAD_KEYSTORE_FILE }}
          google-services: ${{ secrets.GOOGLESERVICES }}
          firebase-creds: ${{ secrets.FIREBASECREDS }}
          playstore-creds: ${{ secrets.PLAYSTORECREDS }}

      - uses: ./.github/actions/create-release-notes
        name: Create Release Notes
        with:
          tag-name: ${{ steps.rel_number.outputs.version }}
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      # Download Translations 已移除（首版）。三個理由,任一個都足夠:
      #
      # 1. 它會讓這個 job 直接掛掉。密鑰未設定時 `jq -r '.bundle_url'` 會印出 "null",
      #    接著 `curl null` 以退出碼 6 失敗;composite action 跑在 `bash -eo pipefail`
      #    之下,所以整個 job 在 gradle 還沒開始前就結束。
      # 2. 它會覆蓋語系清單。那支腳本把產生的 locales_config.xml 寫到
      #    app/src/main/res/xml/ 與 wear/src/main/res/xml/,但本 repo 的檔案在
      #    common/src/main/res/xml/。app 模組的資源優先序高於 common,所以產生出來的
      #    那份會蓋掉我們刻意維持的「en + zh-TW」兩語系設定。
      # 3. 上游的翻譯裡 app_name 是 "Home Assistant"。多拉進來的語系會讓 App 在那些
      #    語言下顯示上游品牌名 —— 那是商標問題,不是體驗瑕疵。
      #
      # 要恢復多語系時,要先有自己的 Lokalise 專案(不是上游的),並且先修好上面第 2 點
      # 的路徑問題,否則語系清單仍會被蓋掉。決策紀錄見 RELEASE-CHECKLIST 6-2。

      - name: Build Release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_FILE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.UPLOAD_KEYSTORE_ALIAS }}
          KEYSTORE_ALIAS_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_ALIAS_PASSWORD }}
          VERSION_CODE: ${{ steps.rel_number.outputs.version-code }}
        # Only the phone bundle is published for the first release. `fastlane deploy_internal` must
        # not reference wear/ or automotive/ AAB paths, because they are no longer built here.
        run: |
          ./gradlew :common:assemble :app:bundleFullRelease

      - name: Archive Build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-aabs
          path: ./**/*.aab

      - name: Deploy to Playstore Internal
        run: bundle exec fastlane deploy_internal

      - name: Promote Internal to Beta
        if: github.event.inputs.beta == 'true'
        run: bundle exec fastlane promote_to_beta
