# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

android.useAndroidX = true

# Our own push relay. Host must match BRAND_HOST (UrlUtil.kt) and the iOS brandHost, which
# derives its own /api root from it - if these disagree, the two apps register with different
# relays. Override in ${GRADLE_USER_HOME}/gradle.properties for a local relay.
#
# STATUS: both routes ARE implemented (apporo-push-relay/functions/webapp.js) and the container
# image is built and pushed. What is missing is deployment: Cloud Run service `mobile-push`
# has no revision yet, and no Cloudflare Worker route sends www.apporo.ai/api/* to it — so
# both URLs currently answer 404 from Odoo. These URL values are final and correct; the
# cutover is server-side and needs no rebuild. Release blocker for working notifications,
# not for uploading the build.
homeAssistantAndroidPushUrl=https://www.apporo.ai/api/sendPush/android/v1
homeAssistantAndroidRateLimitUrl=https://www.apporo.ai/api/checkRateLimits

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
android.nonFinalResIds=false
android.experimental.enableScreenshotTest=true

# Uncomment to disable leak canary
#noLeakCanary=true

# Uncomment to disable Strict Mode
#noStrictMode=true

# Deep-link / OAuth-callback scheme. Debug builds append the suffix so that a debug build and a
# release build on the same device answer different links instead of both matching and making
# Android show an app-chooser. Consumed by common/build.gradle.kts (BuildConfig.DEEP_LINK_SCHEME)
# and AndroidApplicationConventionPlugin (the deepLinkScheme manifest placeholder).
apporoDeepLinkScheme=apporoaiot
apporoDeepLinkSchemeDebugSuffix=-dev
