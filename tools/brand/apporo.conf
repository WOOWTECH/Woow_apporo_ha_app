# ===========================================================================
# apporo 品牌設定 —— Woow_apporo_ha_app
#
# 由 grill-with-docs session (2026-08-10) 產出並經使用者確認。
# 執行順序：
#   python3 tools/brand/preflight.py tools/brand/apporo.conf
#   bash    tools/brand/rebrand.sh    tools/brand/apporo.conf
# ===========================================================================

# --- 必填 ------------------------------------------------------------------
BRAND_ID="apporo"
APP_NAME="Apporo SmartHome"
APPLICATION_ID="com.apporo.home"
BRAND_HOST="aiot.apporo.io"

# ⚠ 品牌方色票是 #C49E53，但白字對比 2.50:1 過不了 WCAG AA (需 4.5:1)。
# 依 ADR-0001 決定：主色改為 #8B6B24（深褐金，白字對比 4.88:1 過 AA），
# 保留同色系但確保按鈕文字可讀。#C49E53 只留在文件與品牌宣傳素材，不進 App。
PRIMARY_COLOR="#8B6B24"

# --- 強烈建議填 ------------------------------------------------------------
URL_SCHEME="apporohome"

# --- 圖形素材 --------------------------------------------------------------
# 這張 SVG 目前包含「鳥形圖騰 + apporo 字樣」，實作階段第一件事是
# 把 apporo 字樣路徑砍掉、只留鳥形，另存 apporo-mark.svg 覆寫此路徑。
# 依 CONTEXT.md 定義的 icon vs wordmark 分工，launcher 只放 mark。
LOGO_SRC="tools/brand/assets/apporo-logo-full.png"

# 鳥形砍字後的空間分配 → LOGO_SCALE 從預設 0.60 拉到 0.75。
LOGO_SCALE="0.55"

# 底色留空 = 使用 PRIMARY_COLOR (#8B6B24)，鳥形是原始 #4d4d4d 深灰，
# 對比 #8B6B24 約 3.4:1，可辨識但不衝突。若要更醒目改成 LAUNCHER_BG="#FFFFFF"。
LAUNCHER_BG="#FFFFFF"

# --- 回報給 HA 伺服器的 App 身分 -------------------------------------------
# 沿用 APPLICATION_ID / APP_NAME
HA_APP_ID=""
HA_APP_NAME=""

# --- 發行 ------------------------------------------------------------------
FASTLANE_PACKAGE=""

# --- 進階 ------------------------------------------------------------------
# 依 skill 建議：https://aiot.apporo.io/android 尚未上線，client_id 不動。
OAUTH_CLIENT_ID="https://woowtech.github.io/Woow_apporo_ha_app/android"
