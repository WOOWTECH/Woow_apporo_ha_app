# ===========================================================================
# apporo 品牌設定 —— Woow_apporo_ha_app
#
# ⚠ 這個 repo 已經換裝完畢。rebrand.sh 在這裡已經不能跑了（它只吃未換裝的
#   upstream 程式碼），跑了會被守門擋下。詳見 tools/brand/README.md。
#
# 本檔現在的用途只剩兩個：
#   1. 記錄 apporo 目前實際生效的品牌值（單一事實來源）
#   2. 餵給 preflight 的 --verify-repo，確認合併上游後品牌值沒被蓋回去：
#        python3 tools/brand/preflight.py --verify-repo tools/brand/apporo.conf
#
# 原始版本由 grill-with-docs session (2026-08-10) 產出並經使用者確認。
# 2026-09-14 更新為 Apporo aiot 身分（com.apporo.home → com.apporo.aiot）。
# ===========================================================================

# --- 必填 ------------------------------------------------------------------
BRAND_ID="apporo"
APP_NAME="Apporo aiot"
APPLICATION_ID="com.apporo.aiot"
BRAND_HOST="aiot.apporo.ai"

# ⚠ 品牌方色票是 #C49E53，但白字對比 2.50:1 過不了 WCAG AA (需 4.5:1)。
# 依 ADR-0001 決定：主色改為 #8B6B24（深褐金，白字對比 4.88:1 過 AA），
# 保留同色系但確保按鈕文字可讀。#C49E53 只留在文件與品牌宣傳素材，不進 App。
PRIMARY_COLOR="#8B6B24"

# --- 強烈建議填 ------------------------------------------------------------
# release 用 apporoaiot://；debug 另外在 app/src/debug/AndroidManifest.xml 宣告
# apporoaiot-dev://，讓 debug 版與 release 版並存時 deep link 不會互搶。
URL_SCHEME="apporoaiot"

# --- 圖形素材 --------------------------------------------------------------
# 這張 SVG 目前包含「鳥形圖騰 + apporo 字樣」，實作階段第一件事是
# 把 apporo 字樣路徑砍掉、只留鳥形，另存 apporo-mark.svg 覆寫此路徑。
# 依 CONTEXT.md 定義的 icon vs wordmark 分工，launcher 只放 mark。
LOGO_SRC="tools/brand/assets/apporo-logo-full.png"

# 鳥形砍字後的空間分配 → LOGO_SCALE 從預設 0.60 拉到 0.75。
LOGO_SCALE="0.55"

# 底色留空 = 使用 PRIMARY_COLOR (#8B6B24)，鳥形是原始 #4d4d4d 深灰，
# 對比 #8B6B24 約 3.4:1，可辨識但不衝突。若要更醒目改成 LAUNCHER_BG="#FFFFFF"。
LAUNCHER_BG="#FFFFFF"

# --- 回報給 HA 伺服器的 App 身分 -------------------------------------------
# 沿用 APPLICATION_ID / APP_NAME
HA_APP_ID=""
HA_APP_NAME=""

# --- 發行 ------------------------------------------------------------------
FASTLANE_PACKAGE=""

# --- 進階 ------------------------------------------------------------------
# OAuth client_id 必須是「現在就連得到、且匿名可讀」的網址：HA 會從伺服器端抓這頁，
# 讀裡面的 rel="redirect_uri" 來比對 App 送出的 callback，抓不到就直接登入失敗。
# https://aiot.apporo.ai/android 目前沒有 DNS 紀錄，所以仍用 GitHub Pages 那頁
# （內容在 docs/android/index.html）。遷移條件寫在 AuthenticationService.kt 的註解。
OAUTH_CLIENT_ID="https://woowtech.github.io/Woow_apporo_ha_app/android"
